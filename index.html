<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>فاوري | نظام الفواتير والديون</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --blue:#0E3A66; --blue-2:#155089; --blue-3:#0A2A4A;
  --orange:#F58220; --orange-2:#D95D00;
  --bg:#EEF2F7; --card:#FFFFFF; --line:#E3E9F0;
  --text:#16283C; --muted:#5A6B7E;
  --warn:#B26A00; --danger:#C62828; --ok:#1E8E5A;
  --a30:#2E9E5B; --a60:#E8A33D; --a90:#F58220; --a120:#D95D00; --amore:#C62828;
  --r:14px; --shadow:0 6px 22px rgba(14,58,102,.09);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;word-break:normal}
button{font-family:inherit}
svg{flex:none}
a{color:var(--blue-2)}

.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--blue-3),var(--blue));color:#fff;padding:12px 22px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 18px rgba(10,42,74,.35);flex-wrap:wrap}
.logo-wrap{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.brand-name{font-size:1.35em;font-weight:900;line-height:1.1}
.brand-sub{font-size:.62em;letter-spacing:2px;opacity:.75;font-weight:600}
.topbar-title{flex:1;min-width:200px;text-align:center;font-size:.95em;font-weight:700;opacity:.95}
.topbar-info{font-size:.78em;opacity:.8;font-weight:600}

.seg{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin:20px auto;max-width:720px;box-shadow:var(--shadow)}
.seg button{flex:1;border:none;background:transparent;padding:11px 10px;border-radius:9px;font-size:.92em;font-weight:800;color:var(--muted);cursor:pointer;transition:.25s;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button.on{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(14,58,102,.3)}
.seg button:not(.on):hover{background:#F2F6FA;color:var(--blue)}

.wrap{max-width:1280px;margin:0 auto;padding:0 18px 40px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--orange)}
.kpi.b::before{background:var(--blue-2)} .kpi.g::before{background:var(--ok)} .kpi.r::before{background:var(--danger)} .kpi.o::before{background:var(--orange-2)}
.kpi .v{font-size:1.55em;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums}
.kpi .v.g{color:var(--ok)} .kpi .v.o{color:var(--orange-2)} .kpi .v.r{color:var(--danger)}
.kpi .l{font-size:.78em;color:var(--muted);font-weight:700;margin-top:2px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.panel-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(180deg,#FBFCFE,#F5F8FB)}
.panel-head h2{font-size:1.05em;font-weight:900;color:var(--blue)}
.panel-head .sub{font-size:.8em;color:var(--muted);font-weight:600}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid transparent;font-size:.86em;font-weight:800;cursor:pointer;transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(14,58,102,.18)}
.btn-p{background:var(--blue);color:#fff}
.btn-o{background:var(--orange);color:#fff}
.btn-g{background:#fff;color:var(--blue);border-color:var(--line)}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 13px;color:var(--muted)}
.search input{flex:1;border:none;outline:none;font-family:inherit;font-size:.9em;color:var(--text);background:transparent}
.fseg{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px}
.fseg button{border:none;background:transparent;padding:7px 14px;border-radius:8px;font-weight:800;font-size:.78em;color:var(--muted);cursor:pointer}
.fseg button.on{background:var(--blue);color:#fff}

.crumbs{display:flex;align-items:center;gap:7px;font-size:.83em;font-weight:700;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.crumbs a{color:var(--blue-2);cursor:pointer}
.crumbs a:hover{text-decoration:underline}
.crumbs .sep{color:#B7C4D2}
.crumbs .cur{color:var(--orange-2)}

.tbl-wrap{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:12px;background:#fff;-webkit-overflow-scrolling:touch}
.tbl-wrap::-webkit-scrollbar,.list-scroll::-webkit-scrollbar{width:9px;height:9px}
.tbl-wrap::-webkit-scrollbar-track,.list-scroll::-webkit-scrollbar-track{background:#F0F4F8}
.tbl-wrap::-webkit-scrollbar-thumb,.list-scroll::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--orange),var(--blue-2));border-radius:8px}
table.tbl{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}
table.tbl th,table.tbl td{white-space:nowrap !important}
table.tbl thead th{position:sticky;top:0;z-index:4;background:var(--blue);color:#fff;padding:11px 14px;text-align:right;font-weight:800;font-size:.78em;letter-spacing:.3px}
table.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:.86em;font-variant-numeric:tabular-nums}
table.tbl tbody tr{background:#fff;transition:background .2s}
table.tbl tbody tr:nth-child(even){background:#F7FAFC}
table.tbl tbody tr:hover{background:#FFF4E8}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl tr.dup td:first-child{border-right:3px solid var(--orange)}
table.tbl tfoot td{position:sticky;bottom:0;z-index:3;background:#FDF3E7;font-weight:900;color:var(--blue);border-top:2px solid var(--orange)}
td.num{font-weight:800}
td.warn{color:var(--warn);font-weight:800}
td.note{color:var(--warn);font-weight:600}
td.name{font-weight:700}
td.lna{color:var(--ok);font-weight:900}
td.lah{color:var(--orange-2);font-weight:900}

.list-scroll{max-height:66vh;overflow-y:auto;padding:2px;-webkit-overflow-scrolling:touch}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cat-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.22s;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center}
.cat-card:hover{transform:translateY(-4px);border-color:var(--orange);box-shadow:0 10px 26px rgba(245,130,32,.18)}
.cat-av{width:46px;height:46px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.25em;font-weight:900;flex:none}
.cat-info{flex:1;min-width:0}
.cat-name{font-weight:900;color:var(--blue);font-size:.98em;margin-bottom:3px}
.cat-meta{font-size:.74em;color:var(--muted);font-weight:600}
.cat-total{text-align:left;flex:none}
.cat-total .v{font-weight:900;font-size:1em;font-variant-numeric:tabular-nums}
.cat-total .l{font-size:.66em;color:var(--muted);font-weight:700}

.inv-row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:11px;display:grid;grid-template-columns:86px 1fr auto;gap:16px;align-items:center;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.inv-row:hover{border-color:var(--orange);transform:translateX(-4px)}
.inv-no{font-size:1.2em;font-weight:900;color:var(--blue);text-align:center;background:#F2F6FA;border-radius:10px;padding:8px 4px;font-variant-numeric:tabular-nums}
.inv-l1{font-size:.88em;font-weight:800}
.inv-l2{font-size:.76em;color:var(--muted);font-weight:600;margin-top:3px}
.inv-note{font-size:.75em;color:var(--warn);font-weight:700;margin-top:4px}
.inv-dup{font-size:.75em;color:var(--danger);font-weight:800;margin-top:4px;display:flex;align-items:center;gap:6px}
.inv-sum{text-align:left}
.inv-sum .v{font-size:1.1em;font-weight:900;font-variant-numeric:tabular-nums}
.inv-sum .l{font-size:.66em;color:var(--muted);font-weight:700}

.info-card{background:linear-gradient(135deg,var(--blue-3),var(--blue));color:#fff;border-radius:var(--r);padding:20px 22px;margin-bottom:16px;box-shadow:0 8px 24px rgba(10,42,74,.3)}
.info-title{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.info-title .no{font-size:1.5em;font-weight:900}
.info-title .tag{font-size:.72em;font-weight:700;opacity:.85;border:1px solid rgba(255,255,255,.35);padding:3px 10px;border-radius:8px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.info-item{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:9px 13px}
.info-item .l{font-size:.68em;opacity:.75;font-weight:700}
.info-item .v{font-size:.92em;font-weight:800;margin-top:2px}
.info-note{margin-top:12px;background:rgba(245,130,32,.18);border:1px solid rgba(245,130,32,.45);border-radius:10px;padding:9px 13px;font-size:.8em;font-weight:700}

.age-bar{display:flex;height:12px;border-radius:8px;overflow:hidden;background:#E7EDF3;margin:10px 0 6px}
.age-bar span{display:block;height:100%}
.age-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.72em;color:var(--muted);font-weight:800}
.age-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-left:5px;vertical-align:-1px}
.dir-lna{color:var(--ok);font-weight:900}
.dir-lah{color:var(--orange-2);font-weight:900}
.sum-line{background:#F7FAFC;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:.9em;font-weight:700;line-height:1.9;margin-top:14px}

.loading{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:50px;text-align:center;box-shadow:var(--shadow)}
.spin{width:46px;height:46px;border:5px solid #E7EDF3;border-top:5px solid var(--orange);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .35s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hidden{display:none !important}
.footer{background:var(--blue-3);color:#fff;padding:18px;text-align:center;font-size:.8em;font-weight:600;margin-top:30px}

@media (max-width:768px){
  .topbar{padding:10px 14px}
  .topbar-title{order:3;width:100%;flex:none}
  .inv-row{grid-template-columns:1fr;gap:10px}
  .inv-no{display:inline-block;width:110px}
  .inv-sum{text-align:right}
  .seg button{font-size:.78em;padding:10px 4px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo-wrap">
    <svg class="logo" viewBox="0 0 48 48" aria-label="شعار فاوري">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFA04D"/><stop offset="1" stop-color="#D95D00"/>
      </linearGradient></defs>
      <rect x="1" y="1" width="46" height="46" rx="12" fill="#0A2A4A"/>
      <rect x="1" y="1" width="46" height="46" rx="12" fill="none" stroke="#F58220" stroke-width="1.4"/>
      <path d="M24 9c0 0-10 11.5-10 17.5a10 10 0 0 0 20 0C34 20.5 24 9 24 9z" fill="url(#lg)"/>
      <circle cx="20.6" cy="27" r="2.7" fill="#fff" opacity=".9"/>
      <path d="M14 38h20" stroke="#F58220" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="brand-name">فاوري</div>
      <div class="brand-sub">FAWORI PAINTS</div>
    </div>
  </div>
  <div class="topbar-title">نظام تدقيق فواتير الشراء وإدارة الديون</div>
  <div class="topbar-info" id="periodInfo">جاري التحميل...</div>
</header>

<div class="wrap">
  <nav class="seg">
    <button id="segDup" class="on" onclick="switchTab('dup')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3l10 18H2z"/><path d="M12 10v4"/><path d="M12 17.5v.5"/></svg>
      كشف التشابه
    </button>
    <button id="segCats" onclick="switchTab('cats')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
      الأصناف والفواتير
    </button>
    <button id="segDeb" onclick="switchTab('debts')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M15 9.5c0-1.4-1.3-2-3-2s-3 .6-3 2 1.3 2 3 2 3 .6 3 2-1.3 2-3 2-3-.6-3-2"/></svg>
      الديون
    </button>
  </nav>
  <div id="viewDup"></div>
  <div id="viewCats" class="hidden"></div>
  <div id="viewDebts" class="hidden"></div>
</div>

<footer class="footer">فاوري © 2026 — نظام تدقيق فواتير الشراء وإدارة الديون | يتحدث تلقائياً عند استبدال ملفات Excel في المستودع</footer>

<script>
let APP=null,curCat=null,curInv=null,curDeb=null;
let catSortDesc=true,invSortDesc=true,detSort='orig';
/* ===== الافتراضي دائماً: قائمة أولاً ===== */
let catView='list',invView='list',detView='list';
let debFilter='all',debSort='bal',debView='list';
const VIEWS=['list','table'];
const VL={list:'قائمة',table:'جدول'};
const SORTS=['orig','qty','total','name'];
const SL={orig:'الأصل',qty:'الكمية',total:'الإجمالي',name:'الاسم'};
const DEB_SORTS=['bal','old','name'];
const DEB_SL={bal:'الأعلى رصيداً',old:'الأكثر تأخراً',name:'الاسم'};
const IC={
 sort:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 5v14M8 19l-3-3M8 19l3-3M16 19V5M16 5l-3 3M16 5l3 3"/></svg>',
 view:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M10 10v10"/></svg>',
 search:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
 warn:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3l10 18H2z"/><path d="M12 10v4"/><path d="M12 17.5v.5"/></svg>',
 phone:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/></svg>'
};

/* ===== تحميل ذكي: اكتشاف الاسم الحقيقي عبر GitHub API ثم محاولات احتياطية ===== */
const REPO='AHMEDBRZAN/Tdkek';
const BASES=['','/Tdkek/'];
const INV_NAMES=['فواتير الشراء.xlsx',encodeURI('فواتير الشراء.xlsx'),'invoices.xlsx','\u200E\u2068فواتير الشراء\u2069.xlsx','\u200Eفواتير الشراء.xlsx','فواتير_الشراء.xlsx'];
const DEB_NAMES=['الديون.xlsx',encodeURI('الديون.xlsx'),'debts.xlsx','\u200E\u2068الديون\u2069.xlsx','\u2068الديون\u2069.xlsx','\u200Eالديون.xlsx','الديون_2026.xlsx'];

async function readWB(buf){const wb=XLSX.read(buf,{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});}
async function findViaAPI(keyword){
  try{
    const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/',{cache:'no-store'});
    if(!r.ok)return null;
    const list=await r.json();
    if(!Array.isArray(list))return null;
    const f=list.find(x=>x.type==='file'&&x.name.indexOf(keyword)!==-1&&/\.xlsx?$/i.test(x.name));
    if(!f)return null;
    return f.download_url||('https://raw.githubusercontent.com/'+REPO+'/main/'+encodeURI(f.name));
  }catch(e){return null;}
}
async function loadSheet(keyword,candidates){
  const api=await findViaAPI(keyword);
  const urls=api?[api]:[];
  for(const b of BASES)for(const n of candidates)urls.push(b+n);
  for(const u of urls){
    try{
      const r=await fetch(u+(u.indexOf('?')===-1?'?':'&')+'t='+Date.now(),{cache:'no-store'});
      if(r.ok){
        const buf=await r.arrayBuffer();
        if(buf.byteLength>0)return readWB(buf);
      }
    }catch(e){}
  }
  return null;
}

function parseNum(v){if(v==null||v==='')return 0;if(typeof v==='number')return v;const n=parseFloat(String(v).replace(/,/g,'').trim());return isNaN(n)?0:n}
function parseMoney(v){return parseNum(String(v==null?'':v).replace(/[^0-9.,-]/g,''))}
function parseDate(v){
  if(!v)return null;
  if(v instanceof Date)return v;
  if(typeof v==='number'){const b=new Date(1899,11,30);return new Date(b.getFullYear(),b.getMonth(),b.getDate()+Math.floor(v))}
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);
  const d=new Date(s);return isNaN(d.getTime())?null:d;
}
function fmtTime(v){if(!v&&v!==0)return'';if(v instanceof Date)return v.toTimeString().slice(0,8);if(typeof v==='number'){const s=Math.round(v*86400);return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}return String(v)}
function fmtKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
function fmt(n){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}

function analyze(rows){
  const cats={};
  let cur={client:'',invNum:null,time:'',date:null,type:'',organizer:'',note:''};
  for(let i=0;i<rows.length;i++){
    const r=rows[i];if(!r||r.length<6)continue;
    const c0=String(r[0]||'').trim();if(c0==='#'||c0==='＃')continue;
    const client=String(r[1]||'').trim();
    const invNum=(r[2]!==''&&r[2]!=null)?String(r[2]).trim():null;
    const time=r[3]?fmtTime(r[3]):'';
    const dateV=r[4];
    const type=String(r[5]||'').trim();
    const code=String(r[6]||'').trim();
    const material=String(r[7]||'').trim();
    const unit=String(r[8]||'').trim();
    const qty=parseNum(r[9]),price=parseNum(r[10]),sale=parseNum(r[11]),total=parseNum(r[12]);
    const disc=parseNum(r[13]),discVal=parseNum(r[14]),invDisc=parseNum(r[15]),fin=parseNum(r[16]);
    const organizer=String(r[17]||'').trim();
    const note=String(r[18]||'').trim();
    if(invNum&&invNum!==cur.invNum){
      cur={client:client||cur.client,invNum,time:time||cur.time,date:cur.date,type:type||cur.type,organizer,note};
      const d=parseDate(dateV);if(d)cur.date=d;
    }else{
      if(client)cur.client=client;
      if(time)cur.time=time;
      if(organizer)cur.organizer=organizer;
      if(type)cur.type=type;
      const d=parseDate(dateV);if(d)cur.date=d;
    }
    if(!code&&!material)continue;
    if(!cur.client||!cur.invNum||!cur.date)continue;
    if(!cats[cur.client])cats[cur.client]={name:cur.client,invoices:{},total:0,itemsCount:0};
    const cat=cats[cur.client];
    const dateKey=fmtKey(cur.date);
    const invKey=cur.invNum+'_'+dateKey;
    if(!cat.invoices[invKey]){
      cat.invoices[invKey]={num:cur.invNum,date:cur.date,dateKey,time:cur.time,type:cur.type||'شراء',organizer:cur.organizer,note:cur.note,invDiscount:invDisc,items:[]};
    }
    cat.invoices[invKey].items.push({_code:code,name:material,unit,qty,price,sale,total,disc,discVal,final:fin,note:(invNum?'':note)});
    cat.total+=total;cat.itemsCount++;
  }
  const categories=Object.values(cats).map((c,i)=>{
    c.invoicesList=Object.values(c.invoices).sort((a,b)=>b.date-a.date||String(b.num).localeCompare(String(a.num)));
    c.invoicesCount=c.invoicesList.length;
    c.latestKey=c.invoicesList.length?c.invoicesList[0].dateKey:'';
    c.latestDate=c.invoicesList.length?c.invoicesList[0].date:null;
    c.color=['#0E3A66','#F58220','#1E8E5A','#C62828','#6A4FBF','#0F7E8A','#B26A00','#41566E','#8E2F3C','#2C6FB0','#12867B','#A85D00','#5C6B7A','#D95D00','#155089'][i%15];
    c.letter=(c.name.trim().charAt(0)||'؟');
    return c;
  }).sort((a,b)=>b.total-a.total);
  return{categories};
}
function computeDuplicates(categories){
  const days=[];
  categories.forEach(cat=>{
    const byDay={};
    cat.invoicesList.forEach(inv=>{(byDay[inv.dateKey]=byDay[inv.dateKey]||[]).push(inv)});
    Object.entries(byDay).forEach(([dateKey,invs])=>{
      if(invs.length<2)return;
      const map={};
      invs.forEach(inv=>inv.items.forEach(it=>{
        const k=it._code||it.name;
        if(!map[k])map[k]={name:it.name,per:{}};
        map[k].per[inv.num]=(map[k].per[inv.num]||0)+it.qty;
      }));
      const dups=Object.values(map).filter(m=>Object.keys(m.per).length>1);
      if(dups.length)days.push({dateKey,date:invs[0].date,category:cat.name,invoices:invs,dups});
    });
  });
  return days.sort((a,b)=>b.dateKey.localeCompare(a.dateKey));
}

function parseDebts(rows){
  const list=[];
  for(const r of rows){
    if(!r||r.length<3)continue;
    const code=String(r[0]||'').trim();
    if(!code||code==='رمز الحساب'||code==='#')continue;
    const name=String(r[1]||'').trim();
    const balRaw=String(r[2]||'').trim();
    const dir=balRaw.includes('لهم')?'لهم':(balRaw.includes('لنا')?'لنا':'');
    list.push({code,name,dir,bal:parseMoney(balRaw),b30:parseNum(r[3]),b60:parseNum(r[4]),b90:parseNum(r[5]),b120:parseNum(r[6]),bMore:parseNum(r[7]),phone:String(r[8]||'').trim()});
  }
  return list;
}
function debStats(list){
  const s={lna:0,lah:0,more:0,mid:0,fresh:0,n:list.length};
  list.forEach(d=>{
    if(d.dir==='لهم')s.lah+=d.bal;else s.lna+=d.bal;
    s.fresh+=d.b30;s.mid+=d.b60+d.b90+d.b120;s.more+=d.bMore;
  });
  return s;
}
function ageBar(d,h){

  return `<div class="age-bar" style="${h?'height:16px':''}">${segs.map(s=>`<span style="background:${s[0]};width:${(s[1]/tot*100).toFixed(2)}%"></span>`).join('')}</div>`;
}

  let html=`<div class="fade">
  <div class="kpis">
    <div class="kpi g"><div class="v g">${fmt(st.lna)}</div><div class="l">إجمالي المستحق لنا</div></div>
    <div class="kpi o"><div class="v o">${fmt(st.lah)}</div><div class="l">إجمالي المستحق لهم</div></div>
    <div class="kpi r"><div class="v r">${fmt(st.more)}</div><div class="l">متأخر أكثر من 120 يوم</div></div>
    <div class="kpi b"><div class="v">${all.length}</div><div class="l">عدد الحسابات</div></div>
  </div>
  <div class="toolbar">
    <div class="fseg">
      <button class="${debFilter==='all'?'on':''}" onclick="setDebFilter('all')">الكل</button>
      <button class="${debFilter==='lna'?'on':''}" onclick="setDebFilter('lna')">لنا</button>
      <button class="${debFilter==='lah'?'on':''}" onclick="setDebFilter('lah')">لهم</button>
    </div>
    <button class="btn btn-g" onclick="cycleDebSort()">${IC.sort} الفرز: ${DEB_SL[debSort]}</button>
    <button class="btn btn-p" onclick="cycleDebView()">${IC.view} العرض: ${VL[debView]}</button>
  </div>
  ${AGE_LEGEND}
  <label class="search" style="margin-top:12px">${IC.search}<input type="text" placeholder="بحث بالاسم أو رمز الحساب أو الجوال..." oninput="filterCards(this.value)"></label>
  <div style="margin-top:14px">`;
  if(debView==='table'){
    html+=`<div class="tbl-wrap"><table class="tbl"><thead><tr>
      <th>رمز الحساب</th><th>اسم الحساب</th><th>الجوال</th><th>الاتجاه</th><th>الرصيد المتبقي</th>
      <th>1-30 يوم</th><th>31-60</th><th>61-90</th><th>91-120</th><th>أكثر من 120</th><th>نسبة التأخر</th>
    </tr></thead><tbody>`;
    list.forEach(d=>{
      const pct=d.bal?((d.bMore/d.bal)*100).toFixed(1):'0';
      html+=`<tr class="cat-card" style="cursor:pointer" data-name="${esc(d.name)} ${d.code} ${d.phone}" onclick="openDebtor(${all.indexOf(d)})">
        <td class="num">${d.code}</td><td class="name">${esc(d.name)}</td>
        <td>${d.phone?`<a href="tel:${d.phone}">${d.phone}</a>`:'-'}</td>
        <td class="${d.dir==='لنا'?'lna':'lah'}">${d.dir||'-'}</td>
        <td class="num"><strong>${fmt(d.bal)}</strong></td>
        <td class="num">${fmt(d.b30)}</td><td class="num">${fmt(d.b60)}</td><td class="num">${fmt(d.b90)}</td><td class="num">${fmt(d.b120)}</td>
        <td class="num" style="color:var(--danger);font-weight:900">${fmt(d.bMore)}</td>
        <td class="num">${pct}%</td></tr>`;
    });
    const fs=debStats(list);
    html+=`</tbody><tfoot><tr><td colspan="4">الإجمالي (${list.length} حساب)</td><td>${fmt(fs.lna+fs.lah)}</td><td>${fmt(fs.fresh)}</td><td colspan="3">${fmt(fs.mid)}</td><td>${fmt(fs.more)}</td><td></td></tr></tfoot></table></div>`;
  }else{
    html+=`<div class="cat-grid">`;
    list.forEach(d=>{
      html+=`<div class="cat-card" data-name="${esc(d.name)} ${d.code} ${d.phone}" onclick="openDebtor(${all.indexOf(d)})" style="align-items:stretch">
        <div class="cat-info">
          <div class="cat-name">${esc(d.name)}</div>
          <div class="cat-meta">${d.code}${d.phone?' · '+d.phone:''}</div>
          ${ageBar(d,false)}
          <div class="cat-meta">متأخر +120: <b style="color:var(--danger)">${fmt(d.bMore)}</b></div>
        </div>
        <div class="cat-total"><div class="v ${d.dir==='لنا'?'dir-lna':'dir-lah'}">${fmt(d.bal)}</div><div class="l">${d.dir||''}</div></div>
      </div>`;
    });
    html+=`</div>`;
  }
  html+=`</div></div>`;
  box.innerHTML=html;
}
function openDebtor(i){curDeb=APP.debts[i];renderDebtorDetail();window.scrollTo(0,0)}
function renderDebtorDetail(){
  const d=curDeb;
  const mid=d.b60+d.b90+d.b120;
  const pct=v=>d.bal?((v/d.bal)*100).toFixed(1)+'%':'0%';
  const dirTxt=d.dir==='لنا'?'مستحق لنا — الطرف الآخر لم يدفع بعد':(d.dir==='لهم'?'مستحق لهم — علينا نحن الدفع':'غير محدد');
  let html=`<div class="fade">
    <div class="crumbs"><a onclick="renderDebts()">الديون</a><span class="sep">›</span><span class="cur">${esc(d.name)}</span></div>
    <div class="info-card">
      <div class="info-title"><span class="no">${esc(d.name)}</span><span class="tag">${d.dir||'-'}</span>${d.phone?`<span class="tag" style="display:inline-flex;align-items:center;gap:6px"><a style="color:#fff;text-decoration:none" href="tel:${d.phone}">${IC.phone} ${d.phone}</a></span>`:''}</div>
      <div class="info-grid">
        <div class="info-item"><div class="l">رمز الحساب</div><div class="v">${d.code}</div></div>
        <div class="info-item"><div class="l">الرصيد المتبقي الكامل</div><div class="v">${fmt(d.bal)}</div></div>
        <div class="info-item"><div class="l">الاتجاه</div><div class="v">${dirTxt}</div></div>
        <div class="info-item"><div class="l">غير مدفوع (+120 يوم)</div><div class="v" style="color:#FFB4A8">${fmt(d.bMore)}</div></div>
      </div>
      <div style="margin-top:14px">${ageBar(d,true)}
        <div class="age-legend" style="color:rgba(255,255,255,.85)">
          <span><i style="background:var(--a30)"></i>1-30</span><span><i style="background:var(--a60)"></i>31-60</span>
          <span><i style="background:var(--a90)"></i>61-90</span><span><i style="background:var(--a120)"></i>91-120</span>
          <span><i style="background:var(--amore)"></i>+120</span>
        </div>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi g"><div class="v g">${fmt(d.b30)}</div><div class="l">ضمن المدة (1-30 يوم)</div></div>
      <div class="kpi o"><div class="v o">${fmt(mid)}</div><div class="l">متأخر (31-120 يوم)</div></div>
      <div class="kpi r"><div class="v r">${fmt(d.bMore)}</div><div class="l">ما انْدفع (+120 يوم)</div></div>
      <div class="kpi b"><div class="v">${fmt(d.bal)}</div><div class="l">إجمالي المتبقي</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>تفاصيل عمر الدين</h2><span class="sub">بالأيام منذ الاستحقاق</span></div>
      <div class="tbl-wrap" style="border:none;border-radius:0;max-height:none">
        <table class="tbl"><thead><tr><th>المرحلة</th><th>المدة</th><th>المبلغ</th><th>النسبة من الرصيد</th></tr></thead><tbody>
          <tr><td class="name" style="color:var(--a30)">جديد ضمن المدة</td><td>1 - 30 يوم</td><td class="num">${fmt(d.b30)}</td><td class="num">${pct(d.b30)}</td></tr>
          <tr><td class="name" style="color:var(--a60)">تأخر خفيف</td><td>31 - 60 يوم</td><td class="num">${fmt(d.b60)}</td><td class="num">${pct(d.b60)}</td></tr>
          <tr><td class="name" style="color:var(--a90)">تأخر متوسط</td><td>61 - 90 يوم</td><td class="num">${fmt(d.b90)}</td><td class="num">${pct(d.b90)}</td></tr>
          <tr><td class="name" style="color:var(--a120)">تأخر كبير</td><td>91 - 120 يوم</td><td class="num">${fmt(d.b120)}</td><td class="num">${pct(d.b120)}</td></tr>
          <tr><td class="name" style="color:var(--amore)">غير مدفوع</td><td>أكثر من 120 يوم</td><td class="num" style="color:var(--danger);font-weight:900">${fmt(d.bMore)}</td><td class="num" style="color:var(--danger);font-weight:900">${pct(d.bMore)}</td></tr>
        </tbody><tfoot><tr><td colspan="2">الإجمالي المتبقي</td><td>${fmt(d.bal)}</td><td>100%</td></tr></tfoot></table>
      </div>
    </div>
    <div class="sum-line">
      ${d.dir==='لنا'
        ? `خلاصة الحساب: <b>${esc(d.name)}</b> متبقي عليه <b class="dir-lna">${fmt(d.bal)}</b> — ضمن المدة <b>${fmt(d.b30)}</b>، وتأخر 31-120 يوم <b>${fmt(mid)}</b>، والذي ما زال غير مدفوع (+120 يوم) <b style="color:var(--danger)">${fmt(d.bMore)}</b>.`
        : `خلاصة الحساب: <b>${esc(d.name)}</b> رصيد باتجاه <b class="dir-lah">لهم</b> بمبلغ <b>${fmt(d.bal)}</b> — أي أن علينا نحن الدفع، منه متأخر أكثر من 120 يوم <b style="color:var(--danger)">${fmt(d.bMore)}</b>.`}
    </div>
    <div style="margin-top:16px"><button class="btn btn-g" onclick="renderDebts()">العودة لقائمة الديون</button></div>
  </div>`;
  document.getElementById('viewDebts').innerHTML=html;
}

/* ========== البدء ========== */
async function init(){
  try{
    const invRows=await loadSheet('فواتير',INV_NAMES);
    if(!invRows)throw new Error('لم يتم العثور على ملف فواتير الشراء في المستودع');
    APP=analyze(invRows);
    APP.dupDays=computeDuplicates(APP.categories);
    APP.dupSet=new Set();
    APP.dupDays.forEach(d=>d.invoices.forEach(i=>APP.dupSet.add(d.category+'|'+i.num+'|'+i.dateKey)));
    const debRows=await loadSheet('الديون',DEB_NAMES);
    APP.debts=debRows?parseDebts(debRows):[];
    const keys=APP.categories.flatMap(c=>c.invoicesList.map(i=>i.dateKey)).sort();
    document.getElementById('periodInfo').textContent=`${keys[0]} → ${keys[keys.length-1]} · ${APP.categories.length} صنف · ${APP.debts.length} حساب دين`;
    renderDup();renderCats();renderDebts();switchTab('dup');
  }catch(e){
    document.getElementById('viewDup').innerHTML=`<div class="loading"><div class="spin"></div><h3 style="color:var(--danger)">تعذر تحميل البيانات</h3><p style="color:var(--muted);margin-top:8px">${esc(e.message)}</p><button class="btn btn-p" style="margin-top:16px" onclick="init()">إعادة المحاولة</button></div>`;
  }
}
init();
setInterval(init,300000);
</script>
