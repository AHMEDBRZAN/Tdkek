<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>فاوري | نظام التدقيق الشامل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --blue:#0E3A66; --blue-2:#155089; --blue-3:#0A2A4A;
  --orange:#F58220; --orange-2:#D95D00;
  --bg:#EEF2F7; --card:#FFF; --line:#E3E9F0;
  --text:#16283C; --muted:#5A6B7E;
  --warn:#B26A00; --danger:#C62828; --ok:#1E8E5A;
  --r:14px; --shadow:0 6px 22px rgba(14,58,102,.09);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:96px}
button{font-family:inherit} svg{flex:none} a{color:var(--blue-2)}

.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--blue-3),var(--blue));color:#fff;padding:10px 18px;box-shadow:0 4px 18px rgba(10,42,74,.35)}
.topbar-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:12px}
.brand-name{font-size:1.25em;font-weight:900;line-height:1.1}
.brand-sub{font-size:.58em;letter-spacing:2px;opacity:.75;font-weight:600}
.topbar-title{flex:1;min-width:150px;text-align:center;font-size:.95em;font-weight:800}
.refresh-btn{display:inline-flex;align-items:center;gap:7px;background:var(--orange);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:.78em;font-weight:900;cursor:pointer;box-shadow:0 4px 12px rgba(245,130,32,.4)}
.refresh-btn:active{transform:scale(.96)}
.topbar-info{width:100%;text-align:center;font-size:.72em;opacity:.9;font-weight:700;margin-top:6px;line-height:1.7}

.bottom-nav{position:fixed;bottom:0;right:0;left:0;z-index:60;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(14,58,102,.14);display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bottom-nav button{flex:1;border:none;background:transparent;border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-weight:800;font-size:.64em;cursor:pointer}
.bottom-nav button svg{color:var(--muted)}
.bottom-nav button.on{background:#EAF1F8;color:var(--blue)}
.bottom-nav button.on svg{color:var(--orange-2)}

.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 30px}

.page-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 14px}
.page-head h2{font-size:1.2em;font-weight:900;color:var(--blue)}
.page-head .sub{font-size:.76em;color:var(--muted);font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--orange)}
.kpi.b::before{background:var(--blue-2)} .kpi.g::before{background:var(--ok)} .kpi.r::before{background:var(--danger)} .kpi.o::before{background:var(--orange-2)}
.kpi .v{font-size:1.22em;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums;text-align:center;word-break:break-all}
.kpi .v.g{color:var(--ok)} .kpi .v.o{color:var(--orange-2)} .kpi .v.r{color:var(--danger)}
.kpi .l{font-size:.72em;color:var(--muted);font-weight:700;margin-top:3px;text-align:center}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.panel-head{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,#FBFCFE,#F5F8FB)}
.panel-head h3{font-size:.98em;font-weight:900;color:var(--blue)}
.panel-head .sub{font-size:.74em;color:var(--muted);font-weight:600}

.tbl-wrap{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
table.tbl{width:100%;border-collapse:collapse}
table.tbl th,table.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:.8em;text-align:center;white-space:normal;word-break:normal;overflow-wrap:break-word;vertical-align:middle}
table.tbl thead th{background:var(--blue);color:#fff;font-weight:800;font-size:.74em;border-bottom:none}
table.tbl tbody tr:nth-child(even){background:#F7FAFC}
table.tbl tbody tr:hover{background:#FFF4E8}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl tfoot td{background:#FDF3E7;font-weight:900;color:var(--blue);border-top:2px solid var(--orange)}
td.num{font-weight:800;font-variant-numeric:tabular-nums}
td.name{text-align:center;font-weight:700}
td.deb{color:var(--ok);font-weight:800} td.cre{color:var(--orange-2);font-weight:800}
td.run{color:var(--blue-2);font-weight:800} td.warn{color:var(--warn);font-weight:800}
tr.click{cursor:pointer}
@media (max-width:768px){ table.tbl .hs{display:none} table.tbl th,table.tbl td{font-size:.74em;padding:8px 5px} }

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;border:1px solid transparent;font-size:.82em;font-weight:800;cursor:pointer;transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(14,58,102,.18)}
.btn-p{background:var(--blue);color:#fff} .btn-o{background:var(--orange);color:#fff} .btn-g{background:#fff;color:var(--blue);border-color:var(--line)}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--muted)}
.search input{flex:1;border:none;outline:none;font-family:inherit;font-size:.88em;color:var(--text);background:transparent}
.select{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-family:inherit;font-size:.8em;font-weight:800;color:var(--blue);outline:none}
.fseg{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px}
.fseg button{border:none;background:transparent;padding:7px 12px;border-radius:8px;font-weight:800;font-size:.76em;color:var(--muted);cursor:pointer}
.fseg button.on{background:var(--blue);color:#fff}

.crumbs{display:flex;align-items:center;gap:7px;font-size:.8em;font-weight:700;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.crumbs a{color:var(--blue-2);cursor:pointer} .crumbs .sep{color:#B7C4D2} .crumbs .cur{color:var(--orange-2)}

.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cat-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.22s;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.cat-card:hover{transform:translateY(-3px);border-color:var(--orange)}
.cat-av{width:42px;height:42px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.15em;font-weight:900;flex:none}
.cat-info{flex:1;min-width:0;text-align:right}
.cat-name{font-weight:900;color:var(--blue);font-size:.92em;margin-bottom:2px}
.cat-meta{font-size:.7em;color:var(--muted);font-weight:600}
.cat-total{text-align:center;flex:none}
.cat-total .v{font-weight:900;font-size:.95em;font-variant-numeric:tabular-nums}
.cat-total .l{font-size:.62em;color:var(--muted);font-weight:700}

.inv-row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;cursor:pointer;box-shadow:var(--shadow)}
.inv-no{font-size:1.02em;font-weight:900;color:var(--blue);text-align:center;background:#F2F6FA;border-radius:10px;padding:7px 3px}
.inv-l1{font-size:.84em;font-weight:800}
.inv-l2{font-size:.72em;color:var(--muted);font-weight:600;margin-top:2px}
.inv-note{font-size:.72em;color:var(--warn);font-weight:700;margin-top:3px}
.inv-dup{font-size:.72em;color:var(--danger);font-weight:800;margin-top:3px}
.inv-sum{text-align:center}
.inv-sum .v{font-size:1em;font-weight:900;font-variant-numeric:tabular-nums}
.inv-sum .l{font-size:.62em;color:var(--muted);font-weight:700}

.info-card{background:linear-gradient(135deg,var(--blue-3),var(--blue));color:#fff;border-radius:var(--r);padding:18px 20px;margin-bottom:14px;box-shadow:0 8px 24px rgba(10,42,74,.3)}
.info-title{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.info-title .no{font-size:1.3em;font-weight:900}
.info-title .tag{font-size:.7em;font-weight:700;border:1px solid rgba(255,255,255,.35);padding:3px 10px;border-radius:8px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.info-item{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 12px;text-align:center}
.info-item .l{font-size:.66em;opacity:.75;font-weight:700}
.info-item .v{font-size:.88em;font-weight:800;margin-top:2px;word-break:break-all}
.dir-badge{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 18px;border-radius:12px;font-weight:900;font-size:.92em;margin-top:12px;width:100%}
.dir-badge.lna{background:rgba(30,142,90,.2);color:#7FE0B0;border:1px solid rgba(30,142,90,.5)}
.dir-badge.lah{background:rgba(245,130,32,.2);color:#FFC894;border:1px solid rgba(245,130,32,.5)}
.dir-badge.zero{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3)}

.sum-line{background:#F7FAFC;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.8em;font-weight:700;line-height:1.9;margin:12px 0;text-align:center;word-break:break-word}
.ok-line{color:var(--ok)} .bad-line{color:var(--danger)}

.loading{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:44px;text-align:center;box-shadow:var(--shadow)}
.spin{width:44px;height:44px;border:5px solid #E7EDF3;border-top:5px solid var(--orange);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hidden{display:none !important}
.footer{background:var(--blue-3);color:#fff;padding:16px;text-align:center;font-size:.76em;font-weight:600;margin-top:24px}
@media (max-width:768px){ .inv-row{grid-template-columns:1fr;gap:8px} .inv-no{width:100px} .topbar{padding:8px 12px} .topbar-title{font-size:.85em} }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div style="display:flex;align-items:center;gap:10px">
      <svg class="logo" viewBox="0 0 48 48">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFA04D"/><stop offset="1" stop-color="#D95D00"/></linearGradient></defs>
        <rect x="1" y="1" width="46" height="46" rx="12" fill="#0A2A4A"/><rect x="1" y="1" width="46" height="46" rx="12" fill="none" stroke="#F58220" stroke-width="1.4"/>
        <path d="M24 9c0 0-10 11.5-10 17.5a10 10 0 0 0 20 0C34 20.5 24 9 24 9z" fill="url(#lg)"/><circle cx="20.6" cy="27" r="2.7" fill="#fff" opacity=".9"/><path d="M14 38h20" stroke="#F58220" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <div><div class="brand-name">فاوري</div><div class="brand-sub">FAWORI PAINTS</div></div>
    </div>
    <div class="topbar-title">نظام التدقيق الشامل</div>
    <button class="refresh-btn" id="refreshBtn" onclick="refreshFromRepo()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
      تحديث من المستودع
    </button>
  </div>
  <div class="topbar-info" id="periodInfo">جاري التحميل...</div>
  <div class="topbar-info" id="srcInfo" style="margin-top:0;font-size:.66em;opacity:.75"></div>
</header>

<div class="wrap">
  <div id="viewDup"></div>
  <div id="viewCats" class="hidden"></div>
  <div id="viewDebts" class="hidden"></div>
  <div id="viewLed" class="hidden"></div>
</div>

<nav class="bottom-nav">
  <button id="bnDup" class="on" onclick="switchTab('dup')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3l10 18H2z"/><path d="M12 10v4"/><path d="M12 17.5v.5"/></svg>التشابه</button>
  <button id="bnCats" onclick="switchTab('cats')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 7h18M3 12h18M3 17h18"/></svg>فواتير الشراء</button>
  <button id="bnDeb" onclick="switchTab('debts')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M15 9.5c0-1.4-1.3-2-3-2s-3 .6-3 2 1.3 2 3 2 3 .6 3 2-1.3 2-3 2-3-.6-3-2"/></svg>الديون</button>
  <button id="bnLed" onclick="switchTab('led')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 7h7M9 11h7"/></svg>كشف حساب</button>
</nav>

<footer class="footer">فاوري © 2026 — قراءة محلية فورية + تحديث يدوي من المستودع · تدقيق بالدفعات (10,000 سطر/دفعة)</footer>

<script>
'use strict';
let APP=null,curCat=null,curInv=null,curDeb=null,curAcc=null,lastTab='dup';
let catSortDesc=true,invSortDesc=true,detSort='orig';
let catView='list',invView='list',detView='list';
let debFilter='all',debSort='bal',debView='list';
let ledSort='code',ledView='list';
let stmtSort='asc',stmtType='all',stmtView='table',stmtMonth=null;
const VIEWS=['list','table'],VL={list:'قائمة',table:'جدول'};
const SORTS=['orig','qty','total','name'],SL={orig:'الأصل',qty:'الكمية',total:'الإجمالي',name:'الاسم'};
const DEB_SORTS=['bal','old','name'],DEB_SL={bal:'الأعلى رصيداً',old:'الأكثر تأخراً',name:'الاسم'};
const LED_SORTS=['code','act','bal'],LED_SL={code:'رمز الحساب',act:'الأكثر حركة',bal:'الأعلى رصيداً'};
const IC={sort:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 5v14M8 19l-3-3M8 19l3-3M16 19V5M16 5l-3 3M16 5l3 3"/></svg>',
view:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M10 10v10"/></svg>',
search:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
warn:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3l10 18H2z"/><path d="M12 10v4"/><path d="M12 17.5v.5"/></svg>',
book:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>'};

/* ===== خريطة التبويبات (إصلاح خطأ null نهائياً) ===== */
const TABS={
  dup:{view:'viewDup',btn:'bnDup',title:'كشف التشابه — فاوري'},
  cats:{view:'viewCats',btn:'bnCats',title:'فواتير الشراء — فاوري'},
  debts:{view:'viewDebts',btn:'bnDeb',title:'الديون — فاوري'},
  led:{view:'viewLed',btn:'bnLed',title:'كشف الحساب — فاوري'}
};
function switchTab(t){
  if(!TABS[t])t='dup';
  lastTab=t;
  for(const k in TABS){
    const v=document.getElementById(TABS[k].view),b=document.getElementById(TABS[k].btn);
    if(v)v.classList.toggle('hidden',k!==t);
    if(b)b.classList.toggle('on',k===t);
  }
  document.title=TABS[t].title;
  window.scrollTo(0,0);
}

/* ===== التخزين المحلي (IndexedDB) + جلب من المستودع ===== */
const REPO='AHMEDBRZAN/Tdkek',BASES=['','/Tdkek/'];
const INV_NAMES=['فواتير الشراء.xlsx',encodeURI('فواتير الشراء.xlsx'),'invoices.xlsx','\u200E\u2068فواتير الشراء\u2069.xlsx','فواتير_الشراء.xlsx'];
const DEB_NAMES=['الديون.xlsx',encodeURI('الديون.xlsx'),'debts.xlsx','\u200E\u2068الديون\u2069.xlsx','الديون_2026.xlsx'];
const LED_NAMES=['دفتر الاستاذ.xlsx',encodeURI('دفتر الاستاذ.xlsx'),'ledger.xlsx','\u200E\u2068دفتر الاستاذ\u2069.xlsx','دفتر_الاستاذ.xlsx'];
const SRC={};
let IDB_DB=null;
function idb(){return new Promise((res,rej)=>{if(IDB_DB)return res(IDB_DB);if(!('indexedDB' in window))return rej(new Error('no idb'));const rq=indexedDB.open('fawori-db',1);rq.onupgradeneeded=()=>{rq.result.createObjectStore('files')};rq.onsuccess=()=>{IDB_DB=rq.result;res(IDB_DB)};rq.onerror=()=>rej(rq.error);});}
async function cacheGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const rq=db.transaction('files','readonly').objectStore('files').get(k);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error);});}catch(e){return null;}}
async function cacheSet(k,val){try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(val,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}catch(e){}}
async function readWBAll(buf){const wb=XLSX.read(buf,{type:'array'});let rows=[];for(const sn of wb.SheetNames)rows=rows.concat(XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:true}));return rows;}
async function findViaAPI(k){try{const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/',{cache:'no-store'});if(!r.ok)return null;const l=await r.json();if(!Array.isArray(l))return null;const f=l.find(x=>x.type==='file'&&x.name.indexOf(k)!==-1&&/\.xlsx?$/i.test(x.name));return f?(f.download_url||('https://raw.githubusercontent.com/'+REPO+'/main/'+encodeURI(f.name))):null;}catch(e){return null;}}
async function fetchSheet(k,cands){
  const api=await findViaAPI(k);const urls=api?[api]:[];
  for(const b of BASES)for(const n of cands)urls.push(b+n);
  for(const u of urls){try{const r=await fetch(u+(u.indexOf('?')===-1?'?':'&')+'t='+Date.now(),{cache:'no-store'});if(r.ok){const buf=await r.arrayBuffer();if(buf.byteLength>0)return readWBAll(buf);}}catch(e){}}
  return null;
}
async function loadFile(key,keyword,names,force){
  if(!force){const c=await cacheGet(key);if(c&&c.rows&&c.rows.length){SRC[key]={from:'محلي',time:c.time};return c.rows;}}
  const rows=await fetchSheet(keyword,names);
  if(rows&&rows.length){await cacheSet(key,{rows,time:Date.now()});SRC[key]={from:'المستودع',time:Date.now()};return rows;}
  const c=await cacheGet(key);if(c&&c.rows&&c.rows.length){SRC[key]={from:'محلي',time:c.time};return c.rows;}
  return null;
}
function srcLabel(k){const s=SRC[k];if(!s)return '—';const d=new Date(s.time);return s.from+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

/* ===== أدوات ===== */
function parseNum(v){if(v==null||v==='')return 0;if(typeof v==='number')return v;const n=parseFloat(String(v).replace(/,/g,'').trim());return isNaN(n)?0:n}
function parseMoney(v){return parseNum(String(v==null?'':v).replace(/[^0-9.,-]/g,''))}
function parseDate(v){if(!v)return null;if(v instanceof Date)return v;if(typeof v==='number'){const b=new Date(1899,11,30);return new Date(b.getFullYear(),b.getMonth(),b.getDate()+Math.floor(v))}const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);const d=new Date(s);return isNaN(d)?null:d}
function parseLedgerDate(v){if(!v)return null;if(v instanceof Date)return v;if(typeof v==='number'){const b=new Date(1899,11,30);return new Date(b.getFullYear(),b.getMonth(),b.getDate()+Math.floor(v))}const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/);if(m)return new Date(2000+ +m[3],+m[1]-1,+m[2]);m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return new Date(+m[3],+m[1]-1,+m[2]);const d=new Date(s);return isNaN(d)?null:d}
function fmtTime(v){if(!v&&v!==0)return'';if(v instanceof Date)return v.toTimeString().slice(0,8);if(typeof v==='number'){const s=Math.round(v*86400);return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}return String(v)}
function fmtKey(d){return d?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):''}
function fmtDate(d){return d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear():'-'}
function fmt(n){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})}
function tr2(x){return x.toLocaleString('en-US',{maximumFractionDigits:2})}
function fmtSmart(n){const a=Math.abs(n);if(a>=1e12)return tr2(n/1e12)+' ترليون';if(a>=1e9)return tr2(n/1e9)+' مليار';if(a>=1e6)return tr2(n/1e6)+' مليون';return fmt(n)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
function pageHead(t,s){return `<div class="page-head fade"><h2>${t}</h2><span class="sub">${s}</span></div>`}

/* ===== تحليل فواتير الشراء ===== */
function analyze(rows){
  const cats={};let cur={client:'',invNum:null,time:'',date:null,type:'',organizer:'',note:''};
  for(const r of rows){
    if(!r||r.length<6)continue;
    const c0=String(r[0]||'').trim();if(c0==='#'||c0==='＃')continue;
    const client=String(r[1]||'').trim();
    const invNum=(r[2]!==''&&r[2]!=null)?String(r[2]).trim():null;
    const time=r[3]?fmtTime(r[3]):'';const dateV=r[4];const type=String(r[5]||'').trim();
    const code=String(r[6]||'').trim(),material=String(r[7]||'').trim(),unit=String(r[8]||'').trim();
    const qty=parseNum(r[9]),price=parseNum(r[10]),sale=parseNum(r[11]),total=parseNum(r[12]);
    const disc=parseNum(r[13]),discVal=parseNum(r[14]),invDisc=parseNum(r[15]),fin=parseNum(r[16]);
    const organizer=String(r[17]||'').trim(),note=String(r[18]||'').trim();
    if(invNum&&invNum!==cur.invNum){cur={client:client||cur.client,invNum,time:time||cur.time,date:cur.date,type:type||cur.type,organizer,note};const d=parseDate(dateV);if(d)cur.date=d;}
    else{if(client)cur.client=client;if(time)cur.time=time;if(organizer)cur.organizer=organizer;if(type)cur.type=type;const d=parseDate(dateV);if(d)cur.date=d;}
    if(!code&&!material)continue;
    if(!cur.client||!cur.invNum||!cur.date)continue;
    if(!cats[cur.client])cats[cur.client]={name:cur.client,invoices:{},total:0,itemsCount:0};
    const cat=cats[cur.client],dateKey=fmtKey(cur.date),invKey=cur.invNum+'_'+dateKey;
    if(!cat.invoices[invKey])cat.invoices[invKey]={num:cur.invNum,date:cur.date,dateKey,time:cur.time,type:cur.type||'شراء',organizer:cur.organizer,note:cur.note,invDiscount:invDisc,items:[]};
    cat.invoices[invKey].items.push({_code:code,name:material,unit,qty,price,sale,total,disc,discVal,final:fin,note:(invNum?'':note)});
    cat.total+=total;cat.itemsCount++;
  }
  const categories=Object.values(cats).map((c,i)=>{
    c.invoicesList=Object.values(c.invoices).sort((a,b)=>b.date-a.date||String(b.num).localeCompare(String(a.num)));
    c.invoicesCount=c.invoicesList.length;
    c.latestKey=c.invoicesList.length?c.invoicesList[0].dateKey:'';
    c.latestDate=c.invoicesList.length?c.invoicesList[0].date:null;
    c.color=['#0E3A66','#F58220','#1E8E5A','#C62828','#6A4FBF','#0F7E8A','#B26A00','#41566E','#8E2F3C','#2C6FB0','#12867B','#A85D00','#5C6B7A','#D95D00','#155089'][i%15];
    c.letter=(c.name.trim().charAt(0)||'؟');return c;
  }).sort((a,b)=>b.total-a.total);
  return{categories};
}
function computeDuplicates(categories){
  const days=[];
  categories.forEach(cat=>{const byDay={};
    cat.invoicesList.forEach(inv=>{(byDay[inv.dateKey]=byDay[inv.dateKey]||[]).push(inv)});
    Object.entries(byDay).forEach(([dk,invs])=>{if(invs.length<2)return;const map={};
      invs.forEach(inv=>inv.items.forEach(it=>{const k=it._code||it.name;if(!map[k])map[k]={name:it.name,per:{}};map[k].per[inv.num]=(map[k].per[inv.num]||0)+it.qty;}));
      const dups=Object.values(map).filter(m=>Object.keys(m.per).length>1);
      if(dups.length)days.push({dateKey:dk,date:invs[0].date,category:cat.name,invoices:invs,dups});});});
  return days.sort((a,b)=>b.dateKey.localeCompare(a.dateKey));
}

/* ===== الديون ===== */
function parseDebts(rows){const list=[];
 for(const r of rows){if(!r||r.length<3)continue;const code=String(r[0]||'').trim();if(!code||code==='رمز الحساب'||code==='#')continue;
  const name=String(r[1]||'').trim(),balRaw=String(r[2]||'').trim();
  const dir=balRaw.includes('لهم')?'لهم':(balRaw.includes('لنا')?'لنا':'');
  list.push({code,name,dir,bal:parseMoney(balRaw),b30:parseNum(r[3]),b60:parseNum(r[4]),b90:parseNum(r[5]),b120:parseNum(r[6]),bMore:parseNum(r[7]),phone:String(r[8]||'').trim()});}
 return list}
function debStats(l){const s={lna:0,lah:0,more:0,mid:0,fresh:0,n:l.length};l.forEach(d=>{if(d.dir==='لهم')s.lah+=d.bal;else s.lna+=d.bal;s.fresh+=d.b30;s.mid+=d.b60+d.b90+d.b120;s.more+=d.bMore});return s}

/* ===== دفتر الأستاذ: تدقيق بالدفعات ===== */
async function parseLedgerDeep(rows){
  const acc={};const st={rows:0,tx:0,deb:0,cre:0,skip:0,chunks:0};
  const CH=10000;
  for(let s=0;s<rows.length;s+=CH){
    const chunk=rows.slice(s,s+CH);
    for(const r of chunk){
      st.rows++;
      if(!r||r.length<6)continue;
      const h=String(r[0]||'').trim();
      if(!h||h==='الحساب')continue;
      const m=h.match(/^(\S+)\s*-\s*(.+)$/);
      const code=m?m[1]:h;
      const vno=String(r[1]||'').trim(),type=String(r[2]||'').trim(),dateV=r[3];
      const deb=parseNum(r[4]),cred=parseNum(r[5]);
      const desc=String(r[6]||'').trim(),gen=String(r[7]||'').trim();
      const nameCol=String(r[9]||'').trim(),contra=String(r[10]||'').trim();
      if(!acc[code])acc[code]={code,name:nameCol||(m?m[2]:h),txns:[],types:{},months:{}};
      const a=acc[code];
      if(!vno&&!dateV){st.skip++;continue;}
      const d=parseLedgerDate(dateV),dk=fmtKey(d),mk=dk?dk.slice(0,7):'';
      a.txns.push({date:d,dateKey:dk,month:mk,vno,type,desc,deb,cred,gen,contra});
      if(type)a.types[type]=(a.types[type]||0)+1;
      if(mk){if(!a.months[mk])a.months[mk]={n:0,deb:0,cre:0};a.months[mk].n++;a.months[mk].deb+=deb;a.months[mk].cre+=cred;}
      st.tx++;st.deb+=deb;st.cre+=cred;
    }
    st.chunks++;
    await new Promise(res=>setTimeout(res,0));
  }
  const accounts=Object.values(acc).map(a=>{
    a.txns.sort((x,y)=>(x.dateKey||'').localeCompare(y.dateKey||'')||parseNum(x.gen)-parseNum(y.gen));
    let run=0;a.txns.forEach(t=>{run+=t.deb-t.cred;t.run=run});
    a.count=a.txns.length;
    a.totDeb=a.txns.reduce((s,t)=>s+t.deb,0);
    a.totCre=a.txns.reduce((s,t)=>s+t.cred,0);
    a.bal=a.totDeb-a.totCre;
    a.dir=a.bal>0.005?'lna':(a.bal<-0.005?'lah':'zero');
    a.dirTxt=a.dir==='lna'?'باقي لنا':(a.dir==='lah'?'باقي له':'مستوٍ (مغلق)');
    a.lastKey=a.count?a.txns[a.count-1].dateKey:'';
    a.lastDate=a.count?a.txns[a.count-1].date:null;
    a.typeList=Object.keys(a.types);
    a.monthList=Object.keys(a.months).sort();
    a.letter=(a.name.trim().charAt(0)||'؟');
    return a;
  });
  accounts.sort((x,y)=>String(x.code).localeCompare(String(y.code),'en',{numeric:true}));
  st.balanced=Math.abs(st.deb-st.cre)<1;st.diff=st.deb-st.cre;
  return{accounts,stats:st};
}

function renderDup(){
  const box=document.getElementById('viewDup');
  if(!APP||!APP.dupDays){box.innerHTML=`<div class="loading"><h3 style="color:var(--danger)">لا توجد بيانات</h3></div>`;return;}
  const days=APP.dupDays;
  const involved=new Set();days.forEach(d=>d.invoices.forEach(i=>involved.add(d.category+'|'+i.num+'|'+i.dateKey)));
  const tD=days.reduce((s,d)=>s+d.dups.length,0);
  const tQ=days.reduce((s,d)=>s+d.dups.reduce((x,m)=>x+Object.values(m.per).reduce((a,b)=>a+b,0),0),0);
  let h=`<div class="fade">`+pageHead('كشف التشابه','مواد مكررة بين فواتير اليوم الواحد لنفس الصنف')+`
  <div class="kpis">
    <div class="kpi r"><div class="v r">${days.length}</div><div class="l">أيام بتشابه</div></div>
    <div class="kpi b"><div class="v">${involved.size}</div><div class="l">فواتير متداخلة</div></div>
    <div class="kpi"><div class="v">${tD}</div><div class="l">مواد متشابهة</div></div>
    <div class="kpi g"><div class="v g">${fmtSmart(tQ)}</div><div class="l">كميات مكررة</div></div></div>`;
  if(!days.length)h+=`<div class="panel" style="padding:26px;text-align:center;color:var(--ok);font-weight:800">لا توجد مواد متشابهة بين فواتير أي يوم</div>`;
  else days.forEach(day=>{
    h+=`<div class="panel"><div class="panel-head"><div><b style="color:var(--blue)">${fmtDate(day.date)}</b> <span class="sub">— ${esc(day.category)}</span></div>
      <span class="sub">الفواتير: <b style="color:var(--orange-2)">${day.invoices.map(i=>i.num).join(' ، ')}</b></span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>المادة</th>${day.invoices.map(i=>`<th>فاتورة ${i.num}</th>`).join('')}<th>المجموع</th><th>الحالة</th></tr></thead><tbody>
      ${day.dups.map(m=>{const q=Object.values(m.per);return `<tr><td class="name">${esc(m.name)}</td>${day.invoices.map(i=>`<td class="num">${m.per[i.num]!==undefined?fmt(m.per[i.num]):'—'}</td>`).join('')}<td class="num">${fmt(q.reduce((a,b)=>a+b,0))}</td><td class="warn">مكرر</td></tr>`}).join('')}
      </tbody></table></div></div>`;});
  h+=`</div>`;
  box.innerHTML=h;
}

    h+=`<div class="panel"><div class="panel-head"><h3>الملخص الشهري</h3><span class="sub">انقر الشهر لعرض حركاته</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>الشهر</th><th>حركات</th><th>مدين</th><th>دائن</th><th>صافي الشهر</th></tr></thead><tbody>
    ${a.monthList.map(mk=>{const m=a.months[mk];return `<tr class="click" onclick="setStmtMonth('${mk}')"><td class="name">${mk}</td><td class="num">${m.n.toLocaleString('en-US')}</td><td class="deb">${fmtSmart(m.deb)}</td><td class="cre">${fmtSmart(m.cre)}</td><td class="run">${fmtSmart(m.deb-m.cre)}</td></tr>`}).join('')}
    </tbody><tfoot><tr><td>الإجمالي</td><td>${a.count.toLocaleString('en-US')}</td><td>${fmtSmart(a.totDeb)}</td><td>${fmtSmart(a.totCre)}</td><td>${fmtSmart(a.bal)}</td></tr></tfoot></table></div></div>
    <div class="panel"><div class="panel-head"><h3>تحليل حسب نوع السند</h3><span class="sub">${a.typeList.length} نوع</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>النوع</th><th>عدد</th><th>مدين</th><th>دائن</th></tr></thead><tbody>
    ${typeStats.map(s=>`<tr><td class="name">${esc(s.tp)||'-'}</td><td class="num">${s.n.toLocaleString('en-US')}</td><td class="deb">${fmtSmart(s.deb)}</td><td class="cre">${fmtSmart(s.cre)}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  }else{
    const tx=stmtTxns();
    h+=`<div class="toolbar"><button class="btn btn-g" onclick="setStmtMonth(null)">‹ كل الأشهر</button>
      <button class="btn btn-p" onclick="cycleStmtView()">${IC.view} ${VL[stmtView]}</button>
      <button class="btn btn-g" onclick="toggleStmtSort()">${IC.sort} ${stmtSort==='asc'?'الأقدم':'الأحدث'}</button>
      <select class="select" onchange="setStmtType(this.value)"><option value="all">كل الأنواع</option>${a.typeList.map(tp=>`<option value="${esc(tp)}" ${stmtType===tp?'selected':''}>${esc(tp)}</option>`).join('')}</select></div>
    <label class="search">${IC.search}<input placeholder="بحث في البيان أو السند أو المقابل..." oninput="filterStmt(this.value)"></label>
    <div class="sum-line">شهر <b>${stmtMonth}</b> · المعروض <b>${tx.length.toLocaleString('en-US')}</b> حركة</div>`;
    const sd=t=>`${t.vno} ${t.desc} ${t.contra} ${t.type} ${t.gen} ${t.dateKey}`;
    if(stmtView==='table'){
      h+=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>التاريخ</th><th class="hs">السند</th><th class="hs">النوع</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead><tbody>`;
      tx.forEach(t=>{h+=`<tr class="stmt-row" data-search="${esc(sd(t)).toLowerCase()}"><td>${fmtDate(t.date)}</td><td class="hs num">${t.vno}</td><td class="hs">${esc(t.type)||'-'}</td><td class="name">${esc(t.desc)||'-'}</td><td class="deb">${t.deb?fmt(t.deb):'—'}</td><td class="cre">${t.cred?fmt(t.cred):'—'}</td><td class="run">${fmt(t.run)}</td></tr>`});
      h+=`</tbody><tfoot><tr><td colspan="4">إجمالي المعروض</td><td>${fmtSmart(tx.reduce((s,t)=>s+t.deb,0))}</td><td>${fmtSmart(tx.reduce((s,t)=>s+t.cred,0))}</td><td></td></tr></tfoot></table></div>`;
    }else{
      tx.forEach(t=>{h+=`<div class="inv-row stmt-row" data-search="${esc(sd(t)).toLowerCase()}" style="cursor:default"><div class="inv-no" style="font-size:.72em;background:#fff;border:1px solid var(--line)">${fmtDate(t.date)}</div>
        <div><div class="inv-l1">${esc(t.desc)||esc(t.type)||'-'}</div><div class="inv-l2">سند ${t.vno} · ${esc(t.type)||'-'}${t.contra?' · مقابل: '+esc(t.contra):''}</div></div>
        <div class="inv-sum"><div class="v" style="color:${t.deb?'var(--ok)':'var(--orange-2)'}">${fmt(t.deb||t.cred)}</div><div class="l">${t.deb?'مدين':'دائن'} · رصيد ${fmt(t.run)}</div></div></div>`});
    }
  }
  h+=`<div style="margin-top:12px"><button class="btn btn-g" onclick="renderLedger()">عودة للحسابات</button></div></div>`;
  box.innerHTML=h;
}

/* ========== البدء والتحديث ========== */
function showSources(){
  document.getElementById('srcInfo').textContent=`المصادر — فواتير: ${srcLabel('inv')} · ديون: ${srcLabel('deb')} · أستاذ: ${srcLabel('led')}`;
}
async function init(force){
  const btn=document.getElementById('refreshBtn');
  try{
    document.getElementById('periodInfo').textContent=force?'جاري الجلب من المستودع...':'جاري القراءة من الذاكرة المحلية...';
    const invRows=await loadFile('inv','فواتير',INV_NAMES,force);
    if(!invRows)throw new Error('لا يوجد ملف فواتير الشراء (لا محلياً ولا في المستودع)');
    APP=analyze(invRows);
    APP.dupDays=computeDuplicates(APP.categories);
    APP.dupSet=new Set();
    APP.dupDays.forEach(d=>d.invoices.forEach(i=>APP.dupSet.add(d.category+'|'+i.num+'|'+i.dateKey)));
    const debRows=await loadFile('deb','الديون',DEB_NAMES,force);
    APP.debts=debRows?parseDebts(debRows):[];
    const ledRows=await loadFile('led','دفتر',LED_NAMES,force);
    if(ledRows){const res=await parseLedgerDeep(ledRows);APP.ledger=res.accounts;APP.ledgerStats=res.stats;}
    else{APP.ledger=[];APP.ledgerStats={rows:0,tx:0,deb:0,cre:0,chunks:0,skip:0,balanced:true,diff:0};}
    const keys=APP.categories.flatMap(c=>c.invoicesList.map(i=>i.dateKey)).sort();
    document.getElementById('periodInfo').textContent=`${keys[0]} → ${keys[keys.length-1]} · ${APP.categories.length} صنف · ${APP.debts.length} دين · ${APP.ledger.length} حساب · ${APP.ledgerStats.tx.toLocaleString('en-US')} حركة مدقّقة`;
    showSources();
    renderDup();renderCats();renderDebts();renderLedger();
    switchTab(lastTab||'dup');
  }catch(e){
    document.getElementById('viewDup').innerHTML=`<div class="loading"><div class="spin"></div><h3 style="color:var(--danger)">تعذر تحميل البيانات</h3><p style="color:var(--muted);margin-top:8px">${esc(e.message)}</p><button class="btn btn-p" style="margin-top:14px" onclick="refreshFromRepo()">تحديث من المستودع</button></div>`;
    document.getElementById('periodInfo').textContent='⚠ فشل التحميل';
    switchTab('dup');
  }finally{
    if(btn)btn.disabled=false;
  }
}
function refreshFromRepo(){
  const btn=document.getElementById('refreshBtn');
  if(btn)btn.disabled=true;
  init(true);
}
init(false);
</script>
